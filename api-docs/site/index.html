<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小红书接口层 API 文档</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #172033;
        --muted: #657086;
        --border: #d8dee8;
        --accent: #1f6feb;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 56px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
      }

      .brand { display: flex; flex-direction: column; gap: 2px; }

      .brand strong { font-size: 15px; }

      .brand span { color: var(--muted); font-size: 12px; }

      .toolbar { display: flex; align-items: center; gap: 10px; }

      .lang-button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        padding: 7px 10px;
      }

      .lang-button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

      #redoc { background: #fff; }

      .intro {
        box-sizing: border-box;
        width: 60%;
        margin: 0;
        padding: 32px 40px 22px;
      }

      .intro h1 { margin: 0 0 18px; font-size: 30px; line-height: 1.25; }

      .intro h2 { margin: 28px 0 10px; font-size: 20px; }

      .intro p, .intro li { color: var(--text); font-size: 15px; line-height: 1.75; }

      .intro p { margin: 10px 0; }

      .intro ul { margin: 8px 0 14px; padding-left: 22px; }

      .intro code {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #f1f4f8;
        padding: 1px 4px;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 0.92em;
      }

      .intro pre {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #111827;
        color: #f8fafc;
        padding: 14px 16px;
      }

      .intro pre code { border: 0; background: transparent; color: inherit; padding: 0; }

      .intro-status { color: var(--muted); }

      .guide-menu-item label {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong id="page-title">小红书接口层 API 文档</strong>
        <span id="page-subtitle">默认中文，可切换 English</span>
      </div>
      <nav class="toolbar" aria-label="Language switcher">
        <button class="lang-button" type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button class="lang-button" type="button" data-lang="en" aria-pressed="false">English</button>
      </nav>
    </header>
    <main id="redoc"></main>
    <script src="../node_modules/redoc/bundles/redoc.standalone.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
