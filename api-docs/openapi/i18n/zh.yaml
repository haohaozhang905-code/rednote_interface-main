info:
  title: 小红书接口层 API
  license_name: MIT
  description: |
    小红书接口层的 API-first 契约。

    接口层以隔离 session 为单位暴露 API-only 的底层原子工具。每个 session
    拥有独立的 user data directory。任何改变状态或抓取数据的操作都必须先绑定
    session，绑定返回的 token 是当前占用者凭证。
servers:
  local: 本地开发服务
tags:
  Sessions:
    description: 公开 session 生命周期与绑定操作。
  Login:
    description: 绑定 session 内的登录动作与登录状态。
  Search:
    description: 创建当前可打开 note_id 上下文的搜索操作。
  Notes:
    description: 设置当前帖子上下文的帖子访问操作。
  Comments:
    description: 受当前帖子上下文约束的评论操作。
  Diagnostics:
    description: session 与请求的轻量诊断信息。
  Admin:
    description: 仅管理端可用的操作。普通应用层不能直接调用。
operations:
  listSessions:
    summary: 查询 Session 列表
    description: 返回普通应用层用于协调的 session 状态字典列表。不会返回敏感运行路径、cookie、token 或原始诊断信息。
    responses:
      "200": Session 列表。
  createSession:
    summary: 创建 Session
    description: 使用服务默认环境创建一个长期存在的隔离身份容器，并为它分配独立浏览器 profile；登录状态和运行时上下文只在当前进程内有效，服务重启后会重置。
    responses:
      "201": Session 已创建。
  bindSession:
    summary: 绑定 Session
    description: 独占一个空闲 session，并返回当前占用 token。该接口不接收 profile 配置；cookie 只通过 cookie 登录动作传入。
    responses:
      "200": Session 已绑定。
      "409": Session 已被占用。
  unbindSession:
    summary: 解绑 Session
    description: 释放 session 的独占占用。浏览器 profile 会保留；登录状态和运行时上下文只在当前进程内保留。
    responses:
      "200": Session 已解绑。
  runLoginAction:
    summary: 执行登录动作
    description: 所有登录动作共用一个接口，通过 action 字段选择具体登录行为。
    responses:
      "200": 登录动作已接收或已完成。
  getLoginStatus:
    summary: 查询登录状态
    description: 纯查询接口。token 可选；传入时仅用于日志与追踪。
    responses:
      "200": 登录状态。
  searchPosts:
    summary: 搜索帖子
    description: 搜索帖子，并在 session 内记录当前搜索结果中的 note_id；响应会保留平台原始搜索响应。
    responses:
      "200": 搜索结果。
  openNoteFromSearch:
    summary: 通过搜索结果打开帖子
    description: 使用当前搜索上下文中的 note_id 打开帖子；响应会保留从页面状态提取的原始帖子对象。
    responses:
      "200": 当前帖子上下文已更新。
  openNoteByXsec:
    summary: 通过 xsec 打开帖子
    description: 使用 note_id 与 xsec 参数直接构建 explorer 链接并打开帖子；响应会保留从页面状态提取的原始帖子对象。
    responses:
      "200": 当前帖子上下文已更新。
  fetchRootComments:
    summary: 获取根评论
    description: 仅获取当前帖子上下文下的根评论；响应会在一个结果级 raw 字段中保留平台原始评论响应。
    responses:
      "200": 根评论。
  fetchSubComments:
    summary: 获取子评论
    description: 获取属于当前帖子上下文的 root_comment_id 下的子评论；响应会保留平台原始评论响应。
    responses:
      "200": 子评论。
  getDiagnostics:
    summary: 查询诊断信息
    description: 返回 session 诊断信息。诊断信息可能包含敏感请求上下文，因此必须传 token。
    responses:
      "200": 诊断信息。
  adminForceUnbindSession:
    summary: 强制解绑 Session
    description: 仅管理端可用，用于恢复未被正常解绑的 session。
    responses:
      "200": Session 已被强制解绑。
  adminDestroySession:
    summary: 销毁 Session
    description: 仅管理端可用，删除未绑定的 session 记录及其 user data directory。
    responses:
      "200": Session 已销毁。
fields:
  cookie: action 为 cookie 时必填。
  phone: action 为 phone_start 时必填。
  code: action 为 phone_submit 时必填。
  note_context_guard: 当前帖子上下文保护字段。必须匹配当前已打开帖子的 note_id。
  token_ownership: 短期占用凭证。请安全保存；它没有 TTL。
schemas:
  SearchFilters:
    description: 可选搜索筛选条件。省略该对象或使用默认值表示不限制搜索。
    properties:
      filter_note_type: 笔记类型筛选。
      filter_note_time: 发布时间筛选。
      filter_note_range: 搜索范围筛选。
      filter_pos_distance: 位置距离筛选。
      latitude: 用于同城或附近等位置筛选的纬度。服务端会将 latitude 和 longitude 转换为平台需要的 geo 参数。
      longitude: 用于同城或附近等位置筛选的经度。服务端会将 latitude 和 longitude 转换为平台需要的 geo 参数。
meta:
  description: 统一响应元信息。必填字段每次都会返回；可选字段仅在适用时返回，接口层不会返回 null 占位。
  properties:
    request_id: 本次接口层请求的唯一标识，用于将调用方错误与服务端日志关联。
    session_id: 仅当操作处于某个具体 session 上下文时返回。
    operation: 稳定的操作标识，与 OpenAPI operationId 一致。
    retry_count: 接口层在返回响应前执行的内部重试次数。
    warnings: 本次请求处理期间产生的非致命警告。
    diagnostics_ref: 仅当本次请求产生了可查询的详细诊断信息时返回。
error:
  description: 稳定、机器可读的错误对象。调用方应根据 code、retryable 和 action 分支处理，不应解析 message 文本。
  properties:
    code: 稳定业务错误码，是调用方分支处理的主要依据。
    message: 给人阅读的简短错误说明，不作为稳定程序契约。
    retryable: 是否可以在不改变参数和 session 上下文的情况下原样重试同一个请求。
    action: 建议调用方执行的下一步动作，是面向应用层恢复流程的稳定枚举。
    details: 安全的结构化排障上下文。不得返回敏感 token、cookie 或原始私密载荷。
component_responses:
  InvalidRequest: "错误码：invalid_request。可能原因：请求体、路径参数或查询参数不符合当前接口 schema。处理建议：fix_request。"
  InvalidSessionToken: "错误码：invalid_session_token。可能原因：token 缺失、格式错误、已解绑失效，或不拥有当前 session。处理建议：bind_session。"
  AdminUnauthorized: "错误码：admin_unauthorized。可能原因：缺少管理端 API Key 或 API Key 无效。处理建议：contact_admin。"
  InvalidTokenOrLoginRequired: "错误码：invalid_session_token、login_required。可能原因：token 不拥有当前 session，或 session profile 未登录。处理建议：bind_session 或 login。"
  SessionNotFound: "错误码：session_not_found。可能原因：session_id 不存在或已被销毁。处理建议：fix_request。"
  SessionOrNoteNotFound: "错误码：session_not_found、note_unavailable。可能原因：session_id 不存在，或目标帖子缺失、私密、已删除、不可访问。处理建议：fix_request 或 inspect_diagnostics。"
  SessionOrDiagnosticsNotFound: "错误码：session_not_found、diagnostics_not_found。可能原因：session_id 不存在，或 diagnostics_ref 不存在/已被清理。处理建议：fix_request 或 inspect_diagnostics。"
  SessionBusy: "错误码：session_busy。可能原因：另一个 token 正在占用当前 session。处理建议：unbind_or_force_unbind。"
  SessionQuotaExceeded: "错误码：session_quota_exceeded。可能原因：接口层已达到配置的 session 数量上限。处理建议：contact_admin。"
  InvalidOrStaleContext: "错误码：invalid_context、stale_context。可能原因：传入的平台 id 不匹配当前 session 位置，或已被后续操作失效。处理建议：reopen_note 或 refresh_search。"
  InvalidXsecToken: "错误码：invalid_xsec_token。可能原因：xsec_token 缺失、过期、格式错误，或与 note_id 不匹配。处理建议：refresh_search。"
  RiskBlocked: "错误码：risk_blocked。可能原因：平台风控、验证要求，或网络/IP 信任问题。处理建议：inspect_diagnostics。"
  RequestFailedOrParserChanged: "错误码：request_failed、parser_changed。可能原因：平台请求重试后失败、返回不可用数据，或响应结构变化。处理建议：wait_and_retry 或 contact_admin。"
  BackendUnavailable: "错误码：backend_unavailable。可能原因：浏览器、存储、队列或内部依赖不可用。处理建议：wait_and_retry。"
  SessionCreateFailed: "错误码：session_create_failed。可能原因：user_data_dir 创建或持久化失败。处理建议：inspect_diagnostics。"
  SessionDestroyFailed: "错误码：session_destroy_failed。可能原因：user_data_dir 清理或持久化删除失败。处理建议：inspect_diagnostics。"
security:
  admin_api_key: 管理端 API Key。
